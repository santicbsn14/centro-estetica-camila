<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservar turno · Camila González (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#151515; --papel:#f8f7fb; --blanco:#ffffff;
    --t72:#4a4a4c; --t48:#7c7c7e; --t30:#a9a8b0;
    --linea:#e6e5eb; --linea2:#d4d3db;
    --ok:#245c3b; --ok-bg:#e0ecdf; --ok-l:#c7ddc4;
    --err:#8f322c; --err-bg:#f5e6e4; --err-l:#e8ccc8;
    --warn:#7a5b12; --warn-bg:#f3ead0;
    --serif:'Fraunces','Playfair Display',Georgia,serif;
    --sans:'Montserrat',system-ui,-apple-system,sans-serif;
    --app-w:460px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--papel); color:var(--tinta); font-family:var(--sans); -webkit-font-smoothing:antialiased}
  body.locked{overflow:hidden}
  .num{font-variant-numeric:tabular-nums}
  .app{max-width:var(--app-w); margin:0 auto; min-height:100vh; background:var(--papel); display:flex; flex-direction:column}

  header.top{position:sticky; top:0; z-index:5; background:rgba(248,247,251,.92); backdrop-filter:blur(6px); border-bottom:.5px solid var(--linea); padding:10px 18px}
  .toprow{display:flex; align-items:center; gap:10px}
  .back{width:32px; height:32px; border-radius:9px; border:.5px solid var(--linea2); background:var(--blanco); color:var(--t72); display:none; align-items:center; justify-content:center; cursor:pointer; flex:none}
  .back.show{display:flex}
  .toprow .lockup{flex:1; display:flex; justify-content:center}
  .toprow img{height:38px; width:auto}
  .steps{display:flex; gap:5px; margin-top:10px}
  .steps i{flex:1; height:3px; border-radius:99px; background:var(--linea2)}
  .steps i.on{background:var(--tinta)}

  main{flex:1; padding:8px 18px 100px}

  .hero{display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px 0 24px}
  .hero img{width:118px; height:auto; margin-bottom:14px}
  .hero h1{font-family:var(--serif); font-weight:600; font-size:23px; margin:0 0 6px}
  .hero p{font-size:13px; color:var(--t48); margin:0; line-height:1.5; max-width:280px}

  .svc{background:var(--blanco); border:.5px solid var(--linea); border-radius:14px; margin-bottom:10px; overflow:hidden}
  .svc-hd{display:flex; align-items:center; gap:12px; padding:15px 16px; cursor:pointer}
  .svc-hd .ico{width:36px; height:36px; border-radius:10px; background:var(--papel); display:grid; place-items:center; flex:none; color:var(--t72)}
  .svc-hd .info{flex:1; min-width:0}
  .svc-hd .n{font-size:14.5px; font-weight:600}
  .svc-hd .d{font-size:12px; color:var(--t48); margin-top:2px; line-height:1.4}
  .svc-hd .meta{display:flex; gap:8px; margin-top:6px; font-size:11.5px; color:var(--t72)}
  .svc-hd .meta span{display:inline-flex; align-items:center; gap:4px}
  .svc-hd .chev{color:var(--t48); flex:none; transition:transform .18s}
  .svc.open .chev{transform:rotate(180deg)}
  .svc-body{max-height:0; overflow:hidden; transition:max-height .22s ease}
  .svc.open .svc-body{max-height:300px}
  .svc-body-in{padding:2px 16px 16px}
  .svc-body-in .lbl{font-size:11.5px; font-weight:600; color:var(--t48); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px}
  .profs{display:flex; flex-direction:column; gap:8px}
  .prof-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:var(--papel); border:.5px solid var(--linea); border-radius:11px; padding:11px 13px; cursor:pointer; font-family:var(--sans)}
  .prof-btn:hover{border-color:var(--tinta)}
  .prof-btn .av{width:34px; height:34px; border-radius:50%; background:#ececef; color:#57545e; display:grid; place-items:center; font-size:12px; font-weight:600; flex:none}
  .prof-btn .nm{font-size:13.5px; font-weight:600}
  .prof-btn .go{margin-left:auto; color:var(--t48)}

  .summary{display:flex; align-items:center; gap:11px; background:var(--blanco); border:.5px solid var(--linea); border-radius:13px; padding:12px 14px; margin-bottom:20px}
  .summary .av{width:36px; height:36px; border-radius:50%; background:#ececef; color:#57545e; display:grid; place-items:center; font-size:12px; font-weight:600; flex:none}
  .summary .tx{flex:1; min-width:0}
  .summary .s1{font-size:13.5px; font-weight:600}
  .summary .s2{font-size:12px; color:var(--t48); margin-top:1px}
  .summary .change{font-size:12px; font-weight:600; color:var(--t72); background:none; border:0; cursor:pointer; text-decoration:underline; text-underline-offset:2px}

  .daygroup{margin-bottom:22px}
  .daylabel{font-size:12.5px; font-weight:600; color:var(--t72); margin:0 0 10px; text-transform:capitalize}
  .slotgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .slot{background:var(--blanco); border:.5px solid var(--linea2); border-radius:10px; padding:10px 4px; font-family:var(--sans); font-size:13px; font-weight:600; color:var(--tinta); text-align:center; cursor:pointer}
  .slot:hover{border-color:var(--tinta)}

  /* === FIX del bug: fixed al VIEWPORT real, no absolute al contenedor scrolleable === */
  .scrim{position:fixed; inset:0; background:rgba(21,21,21,.32); opacity:0; pointer-events:none; transition:opacity .2s; z-index:30}
  .scrim.open{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:50%; bottom:0;
    width:100%; max-width:var(--app-w);
    transform:translateX(-50%) translateY(100%);
    transition:transform .24s cubic-bezier(.4,0,.2,1);
    background:var(--blanco); border-radius:20px 20px 0 0; z-index:31;
    max-height:88vh; display:flex; flex-direction:column;
    box-shadow:0 -8px 30px rgba(21,21,21,.14);
  }
  .sheet.open{transform:translateX(-50%) translateY(0)}
  /* fin del fix */

  .sheet-handle{width:36px; height:4px; background:var(--linea2); border-radius:99px; margin:10px auto 0}
  .sheet-hd{padding:14px 20px 10px; border-bottom:.5px solid var(--linea)}
  .sheet-hd h2{font-family:var(--serif); font-weight:600; font-size:19px; margin:0 0 8px}
  .sheet-sum{background:var(--papel); border-radius:11px; padding:11px 13px; font-size:12.5px; color:var(--t72); line-height:1.6}
  .sheet-sum b{color:var(--tinta); font-weight:600}
  .sheet-body{padding:16px 20px; overflow:auto; flex:1}
  .sheet-foot{padding:14px 20px 22px; border-top:.5px solid var(--linea)}

  .fld{margin-bottom:14px}
  .fld label{display:block; font-size:12.5px; font-weight:500; color:var(--t72); margin-bottom:6px}
  input[type=text],input[type=tel],input[type=email]{width:100%; font-family:var(--sans); font-size:15px; color:var(--tinta); background:var(--papel); border:.5px solid var(--linea2); border-radius:10px; padding:0 13px; height:44px; outline:none}
  input:focus{border-color:var(--tinta); box-shadow:0 0 0 3px rgba(21,21,21,.08); background:var(--blanco)}
  .telrow{display:flex; gap:8px}
  .telrow .pre{flex:none; width:74px; display:flex; align-items:center; justify-content:center; background:var(--papel); border:.5px solid var(--linea2); border-radius:10px; font-size:13.5px; color:var(--t72); font-weight:500}
  .telrow input{flex:1}
  .help{font-size:11px; color:var(--t48); margin-top:5px}

  .btn{font-family:var(--sans); font-size:14px; font-weight:600; border-radius:11px; padding:13px 18px; cursor:pointer; border:.5px solid var(--linea2); background:var(--blanco); color:var(--tinta); width:100%; text-align:center}
  .btn.solid{background:var(--tinta); color:var(--papel); border-color:var(--tinta)}

  .success{display:flex; flex-direction:column; align-items:center; text-align:center; padding:26px 8px 10px}
  .success img{width:104px; height:auto; margin-bottom:16px}
  .success h1{font-family:var(--serif); font-weight:600; font-size:22px; margin:0 0 8px; display:flex; align-items:center; gap:8px}
  .success h1 .chk{color:var(--ok); flex:none}
  .success p{font-size:13.5px; color:var(--t72); line-height:1.6; margin:0 0 22px; max-width:300px}
  .success .card{width:100%; background:var(--blanco); border:.5px solid var(--linea); border-radius:14px; padding:16px 18px; text-align:left; margin-bottom:20px}
  .success .card .row{display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-top:.5px solid var(--linea)}
  .success .card .row:first-child{border-top:0}
  .success .card .k{color:var(--t48)}
  .success .card .v{font-weight:600; text-align:right}
  .wa-note{display:flex; gap:10px; align-items:flex-start; background:var(--ok-bg); border:.5px solid var(--ok-l); border-radius:12px; padding:12px 14px; font-size:12.5px; color:var(--ok); line-height:1.5; text-align:left}

  .demo{position:fixed; top:8px; right:8px; z-index:50; background:var(--tinta); color:var(--papel); font-size:9.5px; font-weight:600; padding:6px 9px; border-radius:8px; cursor:pointer; opacity:.6; line-height:1.4; text-align:right}
  .demo:hover{opacity:1}
  .badge-fix{position:fixed; top:8px; left:8px; z-index:50; background:var(--ok); color:#fff; font-size:9.5px; font-weight:600; padding:6px 9px; border-radius:8px; max-width:150px; line-height:1.4}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  ['st1','st2','st3'].forEach(function(id,i){document.getElementById(id).classList.toggle('on', i < n)});
  document.getElementById('backBtn').classList.toggle('show', n>1);
  render();
  window.scrollTo(0,0);
}
function goBack(){ if(state.step===2){ state.profId=null; setStep(1); } }
function scrollDown(){ window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'}); }

function render(){
  var m=document.getElementById('main');
  if(state.step===1) m.innerHTML=renderCatalogo();
  if(state.step===2) m.innerHTML=renderGrilla();
}

function toggleSvc(id){ state._openSvc = (state._openSvc===id) ? null : id; render(); }
function pickProf(svcId,profId){ state.servicioId=svcId; state.profId=profId; setStep(2); }

function renderGrilla(){
  var s=SERVICIOS.find(function(x){return x.id===state.servicioId});
  var p=s.profs.find(function(x){return x.id===state.profId});
  var html='<div class="summary"><span class="av">'+ini(p.nombre)+'</span><div class="tx"><div class="s1">'+s.nombre+' con '+p.nombre+'</div><div class="s2 num">'+s.dur+' min'+(s.mostrarPrecio?' · '+money(s.precio):'')+'</div></div><button class="change" onclick="goBack()">Cambiar</button></div>';
  html+='<h1 style="font-family:var(--serif);font-weight:600;font-size:19px;margin:0 0 16px">Elegí un horario</h1>';
  DIAS.forEach(function(d){
    var slots=d.slots.map(function(h){return '<button class="slot" onclick="pickSlot(\''+d.label+'\',\''+h+'\')">'+h+'</button>'}).join('');
    html+='<div class="daygroup"><p class="daylabel">'+d.label+'</p><div class="slotgrid">'+slots+'</div></div>';
  });
  return html;
}

function pickSlot(dia,hora){ state.dia=dia; state.hora=hora; openSheet(); }

function openSheet(){
  var s=SERVICIOS.find(function(x){return x.id===state.servicioId});
  var p=s.profs.find(function(x){return x.id===state.profId});
  var sheet=document.getElementById('sheet');
  sheet.innerHTML=
    '<div class="sheet-handle"></div>'+
    '<div class="sheet-hd"><h2>Confirmá tu turno</h2><div class="sheet-sum"><b>'+s.nombre+'</b> con '+p.nombre+'<br>'+state.dia+' · '+state.hora+' hs · '+s.dur+' min</div></div>'+
    '<div class="sheet-body">'+
      '<div class="fld"><label for="f_nom">Tu nombre</label><input type="text" id="f_nom" placeholder="Nombre y apellido"></div>'+
      '<div class="fld"><label for="f_tel">Tu teléfono</label><div class="telrow"><span class="pre">+54 9</span><input type="tel" id="f_tel" placeholder="341 555-1234"></div><p class="help">Te vamos a confirmar por WhatsApp a este número.</p></div>'+
    '</div>'+
    '<div class="sheet-foot"><button class="btn solid" onclick="confirmar()">Confirmar turno</button></div>';
  document.getElementById('scrim').classList.add('open');
  sheet.classList.add('open');
  document.body.classList.add('locked');
}
function closeSheet(){ document.getElementById('scrim').classList.remove('open'); document.getElementById('sheet').classList.remove('open'); document.body.classList.remove('locked'); }

function confirmar(){ closeSheet(); setTimeout(function(){ setStep(3); renderSuccess(); }, 200); }
