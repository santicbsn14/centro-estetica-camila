<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profesionales · Panel Camila González</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#151515; --papel:#f8f7fb; --blanco:#ffffff;
    --t72:#4a4a4c; --t48:#7c7c7e; --t30:#a9a8b0;
    --linea:#e6e5eb; --linea2:#d4d3db;
    --err:#8f322c; --err-bg:#f5e6e4; --err-l:#e8ccc8;
    --warn:#7a5b12; --warn-bg:#f3ead0; --warn-l:#e4d3a0;
    --serif:'Fraunces','Playfair Display',Georgia,serif;
    --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--papel); color:var(--tinta); font-family:var(--sans); -webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .app{display:grid; grid-template-columns:212px 1fr; min-height:100vh}
  .side{background:var(--blanco); border-right:.5px solid var(--linea); display:flex; flex-direction:column; padding:20px 14px}
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px}
  .brand img{width:34px; height:auto}
  .brand .bn{font-family:var(--serif); font-weight:600; font-size:15px; letter-spacing:.02em; line-height:1}
  .brand .bt{font-size:9px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--t48); margin-top:3px}
  .nav{display:flex; flex-direction:column; gap:2px}
  .nav a{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--t72); text-decoration:none; cursor:pointer}
  .nav a .ic{width:17px; height:17px; flex:none; opacity:.85}
  .nav a:hover{background:var(--papel)}
  .nav a.on{background:var(--tinta); color:var(--papel)}
  .side .spacer{flex:1}
  .who{display:flex; align-items:center; gap:10px; padding:10px 8px; border-top:.5px solid var(--linea); margin-top:10px}
  .who .av{width:32px; height:32px; border-radius:50%; background:var(--tinta); color:var(--papel); display:grid; place-items:center; font-size:12px; font-weight:600}
  .who .wn{font-size:12.5px; font-weight:600; line-height:1.2}
  .who .wr{font-size:11px; color:var(--t48)}
  .who .lo{margin-left:auto; color:var(--t48); cursor:pointer; display:grid; place-items:center}
  .who .lo:hover{color:var(--tinta)}

  .main{padding:26px 30px 60px; min-width:0}
  .head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:6px}
  .title{font-family:var(--serif); font-weight:600; font-size:30px; margin:0}
  .sub{font-size:13px; color:var(--t48); margin:0 0 22px}
  .btn{font-family:var(--sans); font-size:13px; font-weight:600; border-radius:10px; padding:9px 15px; cursor:pointer; border:.5px solid var(--linea2); background:var(--blanco); color:var(--tinta); white-space:nowrap; display:inline-flex; align-items:center; gap:7px}
  .btn:hover{background:var(--papel)}
  .btn.solid{background:var(--tinta); color:var(--papel); border-color:var(--tinta)}
  .btn.solid:hover{background:#2a2a2a}
  .btn.danger{color:var(--err); border-color:var(--err-l)}
  .btn.danger:hover{background:var(--err-bg)}
  .btn.ghost{border-color:transparent; background:transparent}
  .btn.ghost:hover{background:var(--papel)}

  .rows{background:var(--blanco); border:.5px solid var(--linea); border-radius:14px; overflow:hidden}
  .row{display:grid; grid-template-columns:2.4fr 120px 120px 110px 96px; align-items:center; gap:14px; padding:14px 18px; border-top:.5px solid var(--linea); cursor:pointer; transition:background .12s}
  .row.hd{cursor:default; background:#fbfbfd; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--t48)}
  .row.hd:hover{background:#fbfbfd}
  .row:not(.hd):hover{background:#fbfbfd}
  .row.off{opacity:.5}
  .person{display:flex; align-items:center; gap:12px}
  .person .av{width:38px; height:38px; border-radius:50%; background:#ececef; color:#57545e; display:grid; place-items:center; font-size:13px; font-weight:600; flex:none}
  .rn{font-size:14px; font-weight:600}
  .re{font-size:12px; color:var(--t48); margin-top:2px}
  .cell{font-size:13px; color:var(--t72)}
  .tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:999px}
  .tag .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
  .t-admin{color:#26215c; background:#eeedfe}
  .t-prof{color:#57545e; background:#ececef}
  .t-si{color:#245c3b; background:#e0ecdf}
  .t-no{color:#7a4a2a; background:#f0e4da}
  .t-act{color:#245c3b; background:#e0ecdf}
  .t-ina{color:#57545e; background:#ececef}

  .scrim{position:fixed; inset:0; background:rgba(21,21,21,.28); opacity:0; pointer-events:none; transition:opacity .18s; z-index:20}
  .scrim.open{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100vh; width:492px; max-width:94vw; background:var(--blanco); border-left:.5px solid var(--linea); transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1); z-index:21; display:flex; flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .dhead{display:flex; align-items:center; gap:12px; padding:20px 22px; border-bottom:.5px solid var(--linea)}
  .dhead h2{font-family:var(--serif); font-weight:600; font-size:20px; margin:0}
  .dclose{margin-left:auto; width:32px; height:32px; border-radius:8px; border:0; background:var(--papel); color:var(--t72); cursor:pointer; display:grid; place-items:center}
  .dclose:hover{color:var(--tinta)}
  .dbody{padding:22px; overflow:auto; flex:1}
  .dact{padding:16px 22px; border-top:.5px solid var(--linea); display:flex; gap:10px; align-items:center}
  .dact .btn.grow{flex:1; justify-content:center}

  .fld{margin-bottom:16px}
  .fld>label{display:block; font-size:13px; font-weight:500; color:var(--t72); margin-bottom:7px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  input[type=text],input[type=email],input[type=password],input[type=number]{width:100%; font-family:var(--sans); font-size:14px; color:var(--tinta); background:var(--blanco); border:.5px solid var(--linea2); border-radius:10px; padding:0 13px; height:42px; outline:none; transition:border-color .15s, box-shadow .15s}
  input:focus{border-color:var(--tinta); box-shadow:0 0 0 3px rgba(21,21,21,.08)}
  input[aria-invalid=true]{border-color:var(--err); box-shadow:0 0 0 3px rgba(143,50,44,.10)}
  .hint{display:none; font-size:12px; color:var(--err); margin-top:6px}
  .hint.show{display:block}
  .help{font-size:11.5px; color:var(--t48); margin-top:6px}

  .switch{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
  .switch input{position:absolute; opacity:0; width:0; height:0}
  .track{width:38px; height:22px; border-radius:999px; background:var(--linea2); position:relative; transition:background .15s; flex:none}
  .track::after{content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s}
  .switch input:checked + .track{background:var(--tinta)}
  .switch input:checked + .track::after{left:18px}
  .switch .sl{font-size:13.5px; font-weight:500}

  .seg2{display:inline-flex; background:var(--papel); border:.5px solid var(--linea); border-radius:11px; padding:3px}
  .seg2 button{border:0; background:transparent; font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--t72); padding:8px 16px; border-radius:8px; cursor:pointer}
  .seg2 button.on{background:var(--tinta); color:var(--papel)}

  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-size:12.5px; font-weight:500; border:.5px solid var(--linea2); border-radius:999px; padding:7px 13px; cursor:pointer; user-select:none; color:var(--t72); background:var(--blanco); display:inline-flex; align-items:center; gap:6px}
  .chip:hover{border-color:var(--tinta)}
  .chip.on{background:var(--tinta); color:var(--papel); border-color:var(--tinta)}
  .chip .ck{width:13px; height:13px; opacity:0}
  .chip.on .ck{opacity:1}

  .sched{margin-top:8px; border:.5px solid var(--linea); border-radius:12px; overflow:hidden}
  .day{border-top:.5px solid var(--linea)}
  .day:first-child{border-top:0}
  .day.on{background:#fbfbfd}
  .dayhd{display:flex; align-items:center; gap:11px; padding:11px 14px}
  .dayhd .nm{font-size:13.5px; font-weight:500; width:42px}
  .dayhd .closed{font-size:12px; color:var(--t30)}
  .blocks{padding:0 14px 12px 67px; display:flex; flex-direction:column; gap:8px}
  .block{display:flex; align-items:center; gap:8px}
  .block input[type=time]{font-family:var(--sans); font-size:13px; border:.5px solid var(--linea2); border-radius:8px; padding:7px 9px; outline:none; color:var(--tinta)}
  .block input[type=time]:focus{border-color:var(--tinta); box-shadow:0 0 0 3px rgba(21,21,21,.08)}
  .block .sepd{color:var(--t48); font-size:13px}
  .block .rm{width:28px; height:28px; border-radius:7px; border:.5px solid var(--linea2); background:var(--blanco); color:var(--t48); cursor:pointer; display:grid; place-items:center}
  .block .rm:hover{color:var(--err); border-color:var(--err-l)}
  .addblock{font-size:12px; font-weight:600; color:var(--t72); background:none; border:0; cursor:pointer; padding:2px 0; display:inline-flex; align-items:center; gap:5px}
  .addblock:hover{color:var(--tinta)}
  .schederr{background:var(--err-bg); border:.5px solid var(--err-l); color:var(--err); font-size:12.5px; border-radius:9px; padding:9px 12px; margin-top:12px; display:none}
  .schederr.show{display:block}

  .callout{border-radius:11px; padding:12px 14px; font-size:12.5px; line-height:1.5; margin-top:8px}
  .callout.warn{background:var(--warn-bg); border:.5px solid var(--warn-l); color:var(--warn)}
  .reset-box{border:.5px solid var(--linea); border-radius:11px; padding:14px; margin-top:8px; display:none}
  .reset-box.show{display:block}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--tinta); color:var(--papel); font-size:13px; font-weight:500; padding:11px 18px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:30; display:flex; align-items:center; gap:9px}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{flex-direction:row; align-items:center; border-right:0; border-bottom:.5px solid var(--linea); padding:12px 16px}
    .brand{padding:0}.nav{flex-direction:row; margin-left:16px; overflow:auto}.nav a span.lbl{display:none}
    .side .spacer{display:none}.who .wn,.who .wr{display:none}.who{margin-left:auto}
    .main{padding:18px 16px 60px}
    .row,.row.hd{grid-template-columns:1fr auto auto}.row .cell.svc,.row .cell.att{display:none}
    .drawer{width:100vw}.grid2{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* editor de horarios (nullable=false: sin toggle hereda) */
var sched={};
function schedFrom(horarios){var m={};DIAS.forEach(function(d){m[d[1]]={on:false,blocks:[]}});if(horarios){horarios.forEach(function(h){m[h.dia]={on:true,blocks:h.bloques.map(function(b){return {desde:b.desde,hasta:b.hasta}})}})}return m;}
function toMin(t){if(!t)return null;var p=t.split(':');return (+p[0])*60+(+p[1]);}
function renderSched(){
  var wrap=document.getElementById('schedWrap');if(!wrap)return;
  wrap.innerHTML=DIAS.map(function(d){
    var st=sched[d[1]];var on=st.on;
    var blocks=on?'<div class="blocks">'+st.blocks.map(function(b,i){return '<div class="block"><input type="time" value="'+b.desde+'" onchange="setBlk('+d[1]+','+i+',\'desde\',this.value)"><span class="sepd">a</span><input type="time" value="'+b.hasta+'" onchange="setBlk('+d[1]+','+i+',\'hasta\',this.value)"><button class="rm" onclick="rmBlk('+d[1]+','+i+')" aria-label="Quitar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'}).join('')+'<button class="addblock" onclick="addBlk('+d[1]+')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Agregar bloque</button></div>':'';
    return '<div class="day'+(on?' on':'')+'"><div class="dayhd"><label class="switch"><input type="checkbox" '+(on?'checked':'')+' onchange="toggleDay('+d[1]+',this.checked)"><span class="track"></span></label><span class="nm">'+d[0]+'</span>'+(on?'':'<span class="closed">no trabaja</span>')+'</div>'+blocks+'</div>';
  }).join('');
}
function toggleDay(dia,on){sched[dia].on=on;if(on&&sched[dia].blocks.length===0)sched[dia].blocks=[{desde:'09:00',hasta:'13:00'}];renderSched();}
function addBlk(dia){sched[dia].blocks.push({desde:'15:00',hasta:'20:00'});renderSched();}
function rmBlk(dia,i){sched[dia].blocks.splice(i,1);if(sched[dia].blocks.length===0)sched[dia].on=false;renderSched();}
function setBlk(dia,i,k,v){sched[dia].blocks[i][k]=v;}
function validateSched(){
  var days=DIAS.filter(function(d){return sched[d[1]].on});
  if(days.length===0)return 'Marcá al menos un día de trabajo.';
  for(var j=0;j<days.length;j++){var d=days[j];var bl=sched[d[1]].blocks.slice().sort(function(a,b){return toMin(a.desde)-toMin(b.desde)});
    for(var i=0;i<bl.length;i++){if(toMin(bl[i].hasta)<=toMin(bl[i].desde))return d[0]+': el fin tiene que ser posterior al inicio.';if(i>0&&toMin(bl[i].desde)<toMin(bl[i-1].hasta))return d[0]+': hay bloques que se solapan.';}}
  return null;
}

function toggleSvc(id){var i=selSvc.indexOf(id);if(i>=0)selSvc.splice(i,1);else selSvc.push(id);renderSvc();}

    '<div class="fld"><label>Horario de trabajo</label><div class="sched" id="schedWrap"></div><div class="schederr" id="schedErr"></div></div>'+
    (isNew
      ? '<div class="fld"><label for="f_pass">Contraseña inicial</label><input type="password" id="f_pass" placeholder="Mínimo 8 caracteres"><p class="help">Se la comunicás por fuera. Ella puede cambiarla después.</p><p class="hint" id="h_pass"></p></div>'
      : '<div class="fld"><label>Contraseña</label><button class="btn" onclick="showReset()" style="width:100%;justify-content:center">Resetear contraseña</button>'+
        '<div class="reset-box" id="resetBox"><div class="fld" style="margin-bottom:10px"><label for="f_np">Nueva contraseña</label><input type="password" id="f_np" placeholder="Mínimo 8 caracteres"></div><div class="callout warn">Al resetear, se cierran las sesiones abiertas de la profesional.</div><button class="btn solid" style="width:100%;justify-content:center;margin-top:10px" onclick="doReset()">Guardar contraseña nueva</button></div></div>')+
  '</div>'+
  '<div class="dact">'+
    (isNew?'':'<button class="btn danger" onclick="tryDeactivate('+u.id+')">'+(u.activo?'Desactivar':'Activar')+'</button>')+
    '<button class="btn grow" onclick="closeDrawer()">Cancelar</button>'+
    '<button class="btn solid grow" onclick="save('+(isNew?'null':u.id)+')">Guardar</button>'+
  '</div>';
}
function openNew(){editing=null;selSvc=[];sched=schedFrom(null);document.getElementById('drawer').innerHTML=drawerHTML(null);openDrawer();setRol('profesional');renderSvc();renderSched();}
function openEdit(id){var u=U.find(function(x){return x.id===id});editing=id;selSvc=u.servicios.slice();sched=schedFrom(u.horarios);document.getElementById('drawer').innerHTML=drawerHTML(u);openDrawer();setRol(u.rol);renderSvc();renderSched();}
function openDrawer(){document.getElementById('scrim').classList.add('open');document.getElementById('drawer').classList.add('open');document.getElementById('drawer').setAttribute('aria-hidden','false');}
function closeDrawer(){document.getElementById('scrim').classList.remove('open');document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').setAttribute('aria-hidden','true');}
function toast(m){var t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2100);}

function showReset(){document.getElementById('resetBox').classList.add('show');}
function doReset(){var np=document.getElementById('f_np');if(!np.value||np.value.length<8){np.setAttribute('aria-invalid','true');return;}closeDrawer();toast('Contraseña actualizada · comunicásela a la profesional');}

function tryDeactivate(id){
  var u=U.find(function(x){return x.id===id});
  if(u.activo && u.futuros>0){
    var box=document.querySelector('#drawer .dbody');
    var c=document.getElementById('deactWarn');
    if(!c){ c=document.createElement('div'); c.id='deactWarn'; c.className='callout warn'; box.insertBefore(c, box.firstChild); box.scrollTop=0; }
    c.innerHTML=u.nombre+' tiene <b>'+u.futuros+' turnos futuros</b>. Desactivarla no los cancela — reasignalos o cancelalos por WhatsApp.<div style="margin-top:10px;display:flex;gap:8px"><button class="btn danger" onclick="doDeactivate('+id+')">Desactivar igual</button><button class="btn ghost" onclick="this.closest(\'.callout\').remove()">Volver</button></div>';
    return;
  }
  doDeactivate(id);
}
function doDeactivate(id){var u=U.find(function(x){return x.id===id});u.activo=!u.activo;render();closeDrawer();toast(u.activo?'Profesional activada':'Profesional desactivada');}

function save(id){
  var nom=document.getElementById('f_nom'), mail=document.getElementById('f_mail');
  var hn=document.getElementById('h_nom'), hm=document.getElementById('h_mail');
  [nom,mail].forEach(function(el){el.setAttribute('aria-invalid','false')}); hn.classList.remove('show'); hm.classList.remove('show');
  if(!nom.value.trim()){nom.setAttribute('aria-invalid','true');hn.textContent='Poné el nombre.';hn.classList.add('show');return;}
  if(!mail.value.trim()){mail.setAttribute('aria-invalid','true');hm.textContent='Poné el email.';hm.classList.add('show');return;}
  var dup=U.some(function(x){return x.id!==id && x.email.toLowerCase()===mail.value.trim().toLowerCase()});
  if(dup){mail.setAttribute('aria-invalid','true');hm.textContent='Ya hay una cuenta con ese email.';hm.classList.add('show');return;}
  if(id===null){var p=document.getElementById('f_pass');if(!p.value||p.value.length<8){p.setAttribute('aria-invalid','true');document.getElementById('h_pass').textContent='Mínimo 8 caracteres.';document.getElementById('h_pass').classList.add('show');return;}}
  var err=validateSched();if(err){var b=document.getElementById('schedErr');b.textContent=err;b.classList.add('show');return;}
  closeDrawer();toast(id?'Cambios guardados':'Profesional creada');
}

render();
</script>
</body>
</html>
