<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicios · Panel Camila González</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#151515; --papel:#f8f7fb; --blanco:#ffffff;
    --t72:#4a4a4c; --t48:#7c7c7e; --t30:#a9a8b0;
    --linea:#e6e5eb; --linea2:#d4d3db;
    --ok:#245c3b; --ok-bg:#e0ecdf;
    --err:#8f322c; --err-bg:#f5e6e4; --err-l:#e8ccc8;
    --serif:'Fraunces','Playfair Display',Georgia,serif;
    --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--papel); color:var(--tinta); font-family:var(--sans); -webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .app{display:grid; grid-template-columns:212px 1fr; min-height:100vh}

  .side{background:var(--blanco); border-right:.5px solid var(--linea); display:flex; flex-direction:column; padding:20px 14px}
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px}
  .brand img{width:34px; height:auto}
  .brand .bn{font-family:var(--serif); font-weight:600; font-size:15px; letter-spacing:.02em; line-height:1}
  .brand .bt{font-size:9px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--t48); margin-top:3px}
  .nav{display:flex; flex-direction:column; gap:2px}
  .nav a{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--t72); text-decoration:none; cursor:pointer}
  .nav a .ic{width:17px; height:17px; flex:none; opacity:.85}
  .nav a:hover{background:var(--papel)}
  .nav a.on{background:var(--tinta); color:var(--papel)}
  .side .spacer{flex:1}
  .who{display:flex; align-items:center; gap:10px; padding:10px 8px; border-top:.5px solid var(--linea); margin-top:10px}
  .who .av{width:32px; height:32px; border-radius:50%; background:var(--tinta); color:var(--papel); display:grid; place-items:center; font-size:12px; font-weight:600}
  .who .wn{font-size:12.5px; font-weight:600; line-height:1.2}
  .who .wr{font-size:11px; color:var(--t48)}
  .who .lo{margin-left:auto; color:var(--t48); cursor:pointer; display:grid; place-items:center}
  .who .lo:hover{color:var(--tinta)}

  .main{padding:26px 30px 60px; min-width:0}
  .head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:6px}
  .title{font-family:var(--serif); font-weight:600; font-size:30px; margin:0}
  .sub{font-size:13px; color:var(--t48); margin:0 0 22px}
  .btn{font-family:var(--sans); font-size:13px; font-weight:600; border-radius:10px; padding:9px 15px; cursor:pointer; border:.5px solid var(--linea2); background:var(--blanco); color:var(--tinta); white-space:nowrap; display:inline-flex; align-items:center; gap:7px}
  .btn:hover{background:var(--papel)}
  .btn.solid{background:var(--tinta); color:var(--papel); border-color:var(--tinta)}
  .btn.solid:hover{background:#2a2a2a}
  .btn.sm{padding:7px 12px; font-size:12.5px}
  .btn.danger{color:var(--err); border-color:var(--err-l)}
  .btn.danger:hover{background:var(--err-bg)}

  .rows{background:var(--blanco); border:.5px solid var(--linea); border-radius:14px; overflow:hidden}
  .row{display:grid; grid-template-columns:2.2fr 92px 92px 120px 120px 96px; align-items:center; gap:14px; padding:15px 18px; border-top:.5px solid var(--linea); cursor:pointer; transition:background .12s}
  .row.hd{cursor:default; background:#fbfbfd; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--t48)}
  .row.hd:hover{background:#fbfbfd}
  .row:not(.hd):hover{background:#fbfbfd}
  .row.off{opacity:.5}
  .rn{font-size:14px; font-weight:600}
  .rd{font-size:12px; color:var(--t48); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cell{font-size:13px; color:var(--t72)}
  .price .oc{display:block; font-size:10.5px; color:var(--t48); font-weight:600}
  .tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px}
  .tag.prop{color:#245c3b; background:#e0ecdf}
  .tag.her{color:#57545e; background:#ececef}
  .tag.act{color:#245c3b; background:#e0ecdf}
  .tag.ina{color:#57545e; background:#ececef}
  .tag .dot{width:6px; height:6px; border-radius:50%; background:currentColor}

  .scrim{position:fixed; inset:0; background:rgba(21,21,21,.28); opacity:0; pointer-events:none; transition:opacity .18s; z-index:20}
  .scrim.open{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100vh; width:492px; max-width:94vw; background:var(--blanco); border-left:.5px solid var(--linea); transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1); z-index:21; display:flex; flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .dhead{display:flex; align-items:center; gap:12px; padding:20px 22px; border-bottom:.5px solid var(--linea)}
  .dhead h2{font-family:var(--serif); font-weight:600; font-size:20px; margin:0}
  .dclose{margin-left:auto; width:32px; height:32px; border-radius:8px; border:0; background:var(--papel); color:var(--t72); cursor:pointer; display:grid; place-items:center}
  .dclose:hover{color:var(--tinta)}
  .dbody{padding:22px; overflow:auto; flex:1}
  .dact{padding:16px 22px; border-top:.5px solid var(--linea); display:flex; gap:10px}
  .dact .btn{flex:1; justify-content:center}
  .dact .btn.danger{flex:none}

  .fld{margin-bottom:16px}
  .fld>label{display:block; font-size:13px; font-weight:500; color:var(--t72); margin-bottom:7px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  input[type=text],input[type=number],textarea{width:100%; font-family:var(--sans); font-size:14px; color:var(--tinta); background:var(--blanco); border:.5px solid var(--linea2); border-radius:10px; padding:0 13px; height:42px; outline:none; transition:border-color .15s, box-shadow .15s}
  textarea{height:auto; min-height:56px; padding:10px 13px; resize:vertical}
  input:focus,textarea:focus{border-color:var(--tinta); box-shadow:0 0 0 3px rgba(21,21,21,.08)}
  input[aria-invalid=true]{border-color:var(--err); box-shadow:0 0 0 3px rgba(143,50,44,.10)}
  .suffix{position:relative}
  .suffix input{padding-right:52px}
  .suffix .u{position:absolute; right:13px; top:0; height:42px; display:flex; align-items:center; font-size:12.5px; color:var(--t48)}
  .prefix{position:relative}
  .prefix input{padding-left:26px}
  .prefix .u{position:absolute; left:13px; top:0; height:42px; display:flex; align-items:center; font-size:14px; color:var(--t48)}
  .hint{display:none; font-size:12px; color:var(--err); margin-top:6px}
  .hint.show{display:block}
  .help{font-size:11.5px; color:var(--t48); margin-top:6px}

  .switch{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
  .switch input{position:absolute; opacity:0; width:0; height:0}
  .track{width:38px; height:22px; border-radius:999px; background:var(--linea2); position:relative; transition:background .15s; flex:none}
  .track::after{content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s}
  .switch input:checked + .track{background:var(--tinta)}
  .switch input:checked + .track::after{left:18px}
  .switch .sl{font-size:13px; font-weight:500}

  .seg2{display:inline-flex; background:var(--papel); border:.5px solid var(--linea); border-radius:11px; padding:3px}
  .seg2 button{border:0; background:transparent; font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--t72); padding:8px 14px; border-radius:8px; cursor:pointer}
  .seg2 button.on{background:var(--tinta); color:var(--papel)}

  .sched{margin-top:14px; border:.5px solid var(--linea); border-radius:12px; overflow:hidden}
  .day{border-top:.5px solid var(--linea)}
  .day:first-child{border-top:0}
  .dayhd{display:flex; align-items:center; gap:11px; padding:11px 14px}
  .dayhd .nm{font-size:13.5px; font-weight:500; width:42px}
  .dayhd .closed{font-size:12px; color:var(--t30); margin-left:2px}
  .blocks{padding:0 14px 12px 67px; display:flex; flex-direction:column; gap:8px}
  .block{display:flex; align-items:center; gap:8px}
  .block input[type=time]{font-family:var(--sans); font-size:13px; border:.5px solid var(--linea2); border-radius:8px; padding:7px 9px; outline:none; color:var(--tinta)}
  .block input[type=time]:focus{border-color:var(--tinta); box-shadow:0 0 0 3px rgba(21,21,21,.08)}
  .block .sepd{color:var(--t48); font-size:13px}
  .block .rm{width:28px; height:28px; border-radius:7px; border:.5px solid var(--linea2); background:var(--blanco); color:var(--t48); cursor:pointer; display:grid; place-items:center}
  .block .rm:hover{color:var(--err); border-color:var(--err-l)}
  .addblock{font-size:12px; font-weight:600; color:var(--t72); background:none; border:0; cursor:pointer; padding:2px 0; display:inline-flex; align-items:center; gap:5px}
  .addblock:hover{color:var(--tinta)}
  .day.on{background:#fbfbfd}
  .schederr{background:var(--err-bg); border:.5px solid var(--err-l); color:var(--err); font-size:12.5px; border-radius:9px; padding:9px 12px; margin-top:12px; display:none}
  .schederr.show{display:block}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--tinta); color:var(--papel); font-size:13px; font-weight:500; padding:11px 18px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:30; display:flex; align-items:center; gap:9px}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{flex-direction:row; align-items:center; border-right:0; border-bottom:.5px solid var(--linea); padding:12px 16px}
    .brand{padding:0}.nav{flex-direction:row; margin-left:16px; overflow:auto}.nav a span.lbl{display:none}
    .side .spacer{display:none}.who .wn,.who .wr{display:none}.who{margin-left:auto}
    .main{padding:18px 16px 60px}
    .row,.row.hd{grid-template-columns:1fr auto auto}
    .row .cell.dur,.row .cell.buf,.row .price{display:none}
    .drawer{width:100vw}.grid2{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <a><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87"/></svg><span class="lbl">Profesionales</span></a>
      <a><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82M4.6 9A1.65 1.65 0 013 8.4"/></svg><span class="lbl">Configuración</span></a>
      <a><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M4.9 4.9l14.2 14.2M16 2v4M8 2v4"/></svg><span class="lbl">Excepciones</span></a>
    </nav>
    <div class="spacer"></div>
    <div class="who"><div class="av">CG</div><div><div class="wn">Camila González</div><div class="wr">admin</div></div><div class="lo" title="Salir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></div></div>
  </aside>

  <main class="main">
    <div class="head">
      <h1 class="title">Servicios</h1>
      <button class="btn solid" onclick="openNew()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Nuevo servicio</button>
    </div>
    <p class="sub" id="sub"></p>
    <div class="rows" id="rows"></div>
  </main>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg><span id="toastMsg"></span></div>

<script>
var DIAS=[['Lun',1],['Mar',2],['Mié',3],['Jue',4],['Vie',5],['Sáb',6],['Dom',0]];
var money=function(c){return '$'+(c/100).toLocaleString('es-AR')};

var S=[
 {id:1,nombre:'Perfilado de cejas',desc:'Diseño y perfilado con pinza y cera',dur:30,buf:10,precio:800000,mostrar:true,horarios:null,orden:1,activo:true},
 {id:2,nombre:'Manicura semipermanente',desc:'Esmaltado semipermanente, incluye retiro',dur:60,buf:15,precio:1500000,mostrar:true,horarios:null,orden:2,activo:true},
 {id:3,nombre:'Limpieza facial profunda',desc:'Limpieza + extracción + hidratación',dur:60,buf:20,precio:2200000,mostrar:true,horarios:null,orden:3,activo:true},
 {id:4,nombre:'Lifting de pestañas',desc:'Curvado y tinte de pestañas naturales',dur:75,buf:15,precio:1800000,mostrar:true,horarios:null,orden:4,activo:true},
 {id:5,nombre:'Uñas esculpidas',desc:'En gel o acrílico, con diseño',dur:90,buf:20,precio:2500000,mostrar:true,orden:5,activo:true,
   horarios:[{dia:3,bloques:[{desde:'09:00',hasta:'18:00'}]},{dia:5,bloques:[{desde:'09:00',hasta:'18:00'}]}]},
 {id:6,nombre:'Depilación con cera',desc:'Media pierna / axilas',dur:45,buf:10,precio:1200000,mostrar:false,horarios:null,orden:6,activo:false}
];

function render(){
  var act=S.filter(function(s){return s.activo}).length;
  document.getElementById('sub').textContent=S.length+' servicios · '+act+' activos en la web';
  var body=S.slice().sort(function(a,b){return a.orden-b.orden}).map(function(s){
    var horar=s.horarios===null
      ? '<span class="tag her"><span class="dot"></span>Hereda</span>'
      : '<span class="tag prop"><span class="dot"></span>Propio</span>';
    var estado=s.activo
      ? '<span class="tag act"><span class="dot"></span>Activo</span>'
      : '<span class="tag ina"><span class="dot"></span>Inactivo</span>';
    var precio=money(s.precio)+(s.mostrar?'':'<span class="oc">oculto en la web</span>');
    return '<div class="row'+(s.activo?'':' off')+'" onclick="openEdit('+s.id+')">'+
      '<div><div class="rn">'+s.nombre+'</div><div class="rd">'+s.desc+'</div></div>'+
      '<div class="cell dur num">'+s.dur+' min</div>'+
      '<div class="cell buf num">+'+s.buf+' min</div>'+
      '<div class="cell price num">'+precio+'</div>'+
      '<div>'+horar+'</div>'+
      '<div>'+estado+'</div></div>';
  }).join('');
  var hd='<div class="row hd"><div>Servicio</div><div>Duración</div><div>Limpieza</div><div>Precio</div><div>Horario</div><div>Estado</div></div>';
  document.getElementById('rows').innerHTML=hd+body;
}

/* ---- editor de horarios ---- */
var sched={}; /* dia -> {on, blocks:[{desde,hasta}]} */
function schedFrom(horarios){
  var m={}; DIAS.forEach(function(d){m[d[1]]={on:false,blocks:[]}});
  if(horarios){ horarios.forEach(function(h){ m[h.dia]={on:true,blocks:h.bloques.map(function(b){return {desde:b.desde,hasta:b.hasta}})}; }); }
  return m;
}
function toMin(t){ if(!t) return null; var p=t.split(':'); return (+p[0])*60+(+p[1]); }
function renderSched(){
  var wrap=document.getElementById('schedWrap'); if(!wrap) return;
  wrap.innerHTML=DIAS.map(function(d){
    var st=sched[d[1]]; var on=st.on;
    var blocks= on ? '<div class="blocks">'+st.blocks.map(function(b,i){
        return '<div class="block"><input type="time" value="'+b.desde+'" onchange="setBlk('+d[1]+','+i+',\'desde\',this.value)"><span class="sepd">a</span><input type="time" value="'+b.hasta+'" onchange="setBlk('+d[1]+','+i+',\'hasta\',this.value)"><button class="rm" onclick="rmBlk('+d[1]+','+i+')" aria-label="Quitar bloque"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
      }).join('')+'<button class="addblock" onclick="addBlk('+d[1]+')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Agregar bloque</button></div>' : '';
    return '<div class="day'+(on?' on':'')+'"><div class="dayhd"><label class="switch"><input type="checkbox" '+(on?'checked':'')+' onchange="toggleDay('+d[1]+',this.checked)"><span class="track"></span></label><span class="nm">'+d[0]+'</span>'+(on?'':'<span class="closed">cerrado</span>')+'</div>'+blocks+'</div>';
  }).join('');
}
function toggleDay(dia,on){ sched[dia].on=on; if(on && sched[dia].blocks.length===0) sched[dia].blocks=[{desde:'09:00',hasta:'13:00'}]; renderSched(); }
function addBlk(dia){ sched[dia].blocks.push({desde:'15:00',hasta:'20:00'}); renderSched(); }
function rmBlk(dia,i){ sched[dia].blocks.splice(i,1); if(sched[dia].blocks.length===0) sched[dia].on=false; renderSched(); }
function setBlk(dia,i,k,v){ sched[dia].blocks[i][k]=v; }
function validateSched(){
  var days=DIAS.filter(function(d){return sched[d[1]].on});
  if(days.length===0) return 'Elegí al menos un día, o cambiá a "Hereda de la profesional".';
  for(var j=0;j<days.length;j++){
    var d=days[j]; var bl=sched[d[1]].blocks.slice().sort(function(a,b){return toMin(a.desde)-toMin(b.desde)});
    for(var i=0;i<bl.length;i++){
      if(toMin(bl[i].hasta)<=toMin(bl[i].desde)) return d[0]+': el fin tiene que ser posterior al inicio.';
      if(i>0 && toMin(bl[i].desde)<toMin(bl[i-1].hasta)) return d[0]+': hay bloques que se solapan.';
    }
  }
  return null;
}

/* ---- drawer ---- */
var mode='hereda';
function setMode(m){ mode=m;
  document.querySelectorAll('#modeSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)});
  document.getElementById('schedBox').style.display=(m==='propio')?'block':'none';
  document.getElementById('schedHelp').style.display=(m==='propio')?'none':'block';
  if(m==='propio') renderSched();
}

function drawerHTML(s){
  var isNew=!s;
  s=s||{nombre:'',desc:'',dur:'',buf:'',precio:0,mostrar:true,horarios:null,orden:S.length+1,activo:true};
  var pesos=s.precio?Math.round(s.precio/100):'';
  return ''+
  '<div class="dhead"><h2>'+(isNew?'Nuevo servicio':'Editar servicio')+'</h2>'+
    '<button class="dclose" onclick="closeDrawer()" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
  '<div class="dbody">'+
    '<div class="fld"><label for="f_nom">Nombre</label><input type="text" id="f_nom" value="'+s.nombre.replace(/"/g,"&quot;")+'" placeholder="Ej: Perfilado de cejas"><p class="hint" id="h_nom">Ya existe un servicio con ese nombre.</p></div>'+
    '<div class="fld"><label for="f_desc">Descripción <span style="color:var(--t48);font-weight:400">(opcional)</span></label><textarea id="f_desc" placeholder="Qué incluye el servicio">'+s.desc+'</textarea></div>'+
    '<div class="grid2">'+
      '<div class="fld"><label for="f_dur">Duración</label><div class="suffix"><input type="number" id="f_dur" min="1" value="'+s.dur+'" placeholder="60"><span class="u">min</span></div></div>'+
      '<div class="fld"><label for="f_buf">Limpieza posterior</label><div class="suffix"><input type="number" id="f_buf" min="0" value="'+s.buf+'" placeholder="15"><span class="u">min</span></div><p class="help">Ocupa agenda, no se cobra.</p></div>'+
    '</div>'+
    '<div class="fld"><label for="f_pre">Precio</label><div class="prefix"><span class="u">$</span><input type="number" id="f_pre" min="0" value="'+pesos+'" placeholder="15000"></div><p class="help">En pesos. Se guarda en centavos.</p></div>'+
    '<div class="fld"><label class="switch"><input type="checkbox" id="f_most" '+(s.mostrar?'checked':'')+'><span class="track"></span><span class="sl">Mostrar el precio en la web</span></label></div>'+
    '<div class="fld"><label>Horario del servicio</label>'+
      '<div class="seg2" id="modeSeg"><button data-m="hereda" onclick="setMode(\'hereda\')">Hereda de la profesional</button><button data-m="propio" onclick="setMode(\'propio\')">Horario propio</button></div>'+
      '<p class="help" id="schedHelp">El servicio se ofrece en los mismos horarios que cada profesional que lo presta.</p>'+
      '<div id="schedBox" style="display:none"><div class="sched" id="schedWrap"></div><div class="schederr" id="schedErr"></div><p class="help">Este horario se cruza con el de la profesional y el del centro. Sólo lo restringe; no abre horas nuevas.</p></div>'+
    '</div>'+
    '<div class="fld" style="max-width:120px"><label for="f_ord">Orden</label><input type="number" id="f_ord" min="0" value="'+s.orden+'"></div>'+
  '</div>'+
  '<div class="dact">'+
    (isNew?'':'<button class="btn danger" onclick="toggleActivo('+s.id+')">'+(s.activo?'Desactivar':'Activar')+'</button>')+
    '<button class="btn" onclick="closeDrawer()">Cancelar</button>'+
    '<button class="btn solid" onclick="save('+(isNew?'null':s.id)+')">Guardar</button>'+
  '</div>';
}
function openNew(){ editing=null; sched=schedFrom(null); document.getElementById('drawer').innerHTML=drawerHTML(null); openDrawer(); setMode('hereda'); }
function openEdit(id){ var s=S.find(function(x){return x.id===id}); editing=id; sched=schedFrom(s.horarios); document.getElementById('drawer').innerHTML=drawerHTML(s); openDrawer(); setMode(s.horarios===null?'hereda':'propio'); }
var editing=null;
function openDrawer(){ document.getElementById('scrim').classList.add('open'); document.getElementById('drawer').classList.add('open'); document.getElementById('drawer').setAttribute('aria-hidden','false'); }
function closeDrawer(){ document.getElementById('scrim').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer').setAttribute('aria-hidden','true'); }

function toast(msg){ var t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show')},1900); }

function toggleActivo(id){ var s=S.find(function(x){return x.id===id}); s.activo=!s.activo; render(); closeDrawer(); toast(s.activo?'Servicio activado':'Servicio desactivado · deja de ofrecerse en la web'); }

function save(id){
  var nom=document.getElementById('f_nom');
  var hn=document.getElementById('h_nom'); hn.classList.remove('show'); nom.setAttribute('aria-invalid','false');
  if(!nom.value.trim()){ nom.setAttribute('aria-invalid','true'); hn.textContent='Poné un nombre.'; hn.classList.add('show'); nom.focus(); return; }
  var dup=S.some(function(x){return x.id!==id && x.nombre.toLowerCase()===nom.value.trim().toLowerCase()});
  if(dup){ nom.setAttribute('aria-invalid','true'); hn.textContent='Ya existe un servicio con ese nombre.'; hn.classList.add('show'); nom.focus(); return; }
  if(mode==='propio'){
    var err=validateSched(); var box=document.getElementById('schedErr');
    if(err){ box.textContent=err; box.classList.add('show'); return; } else box.classList.remove('show');
  }
  closeDrawer();
  toast(id?'Cambios guardados':'Servicio creado');
}

render();
</script>
</body>
</html>
