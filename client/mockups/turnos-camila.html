<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnos · Panel Camila González</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#151515; --papel:#f8f7fb; --blanco:#ffffff;
    --t72:#4a4a4c; --t48:#7c7c7e; --t30:#a9a8b0;
    --linea:#e6e5eb; --linea2:#d4d3db;
    --serif:'Fraunces','Playfair Display',Georgia,serif;
    --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--papel); color:var(--tinta); font-family:var(--sans); -webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}

  .app{display:grid; grid-template-columns:212px 1fr; min-height:100vh}

  /* sidebar */
  .side{background:var(--blanco); border-right:.5px solid var(--linea); display:flex; flex-direction:column; padding:20px 14px}
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px}
  .brand img{width:34px; height:auto}
  .brand .bn{font-family:var(--serif); font-weight:600; font-size:15px; letter-spacing:.02em; line-height:1}
  .brand .bt{font-size:9px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--t48); margin-top:3px}
  .nav{display:flex; flex-direction:column; gap:2px}
  .nav a{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:13.5px; font-weight:500; color:var(--t72); text-decoration:none; cursor:pointer}
  .nav a .ic{width:17px; height:17px; flex:none; opacity:.85}
  .nav a:hover{background:var(--papel)}
  .nav a.on{background:var(--tinta); color:var(--papel)}
  .nav a.adminonly{display:flex}
  body.prof .nav a.adminonly{display:none}
  .side .spacer{flex:1}
  .who{display:flex; align-items:center; gap:10px; padding:10px 8px; border-top:.5px solid var(--linea); margin-top:10px}
  .who .av{width:32px; height:32px; border-radius:50%; background:var(--tinta); color:var(--papel); display:grid; place-items:center; font-size:12px; font-weight:600; flex:none}
  .who .wn{font-size:12.5px; font-weight:600; line-height:1.2}
  .who .wr{font-size:11px; color:var(--t48); text-transform:capitalize}
  .who .lo{margin-left:auto; color:var(--t48); cursor:pointer; display:grid; place-items:center}
  .who .lo:hover{color:var(--tinta)}

  /* main */
  .main{padding:26px 30px 60px; min-width:0}
  .demo{display:inline-flex; align-items:center; gap:8px; background:#efeef4; border:.5px solid var(--linea2); border-radius:999px; padding:4px 6px 4px 12px; font-size:11.5px; color:var(--t72); margin-bottom:20px}
  .demo b{font-weight:600; color:var(--tinta)}
  .demo .seg{display:flex; background:var(--blanco); border-radius:999px; padding:2px}
  .demo .seg button{border:0; background:transparent; font-family:var(--sans); font-size:11.5px; font-weight:600; color:var(--t48); padding:4px 12px; border-radius:999px; cursor:pointer}
  .demo .seg button.on{background:var(--tinta); color:var(--papel)}

  .head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:20px}
  .title{font-family:var(--serif); font-weight:600; font-size:30px; letter-spacing:.005em; margin:0}
  .sub{font-size:13px; color:var(--t48)}

  .filters{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:22px}
  .fseg{display:flex; background:var(--blanco); border:.5px solid var(--linea); border-radius:11px; padding:3px}
  .fseg button{border:0; background:transparent; font-family:var(--sans); font-size:13px; font-weight:500; color:var(--t72); padding:7px 14px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:7px}
  .fseg button.on{background:var(--tinta); color:var(--papel)}
  .fseg button .cnt{font-size:11px; font-weight:600; padding:1px 6px; border-radius:999px; background:#efeef4; color:var(--t72)}
  .fseg button.on .cnt{background:rgba(255,255,255,.22); color:var(--papel)}
  .pill{display:inline-flex; align-items:center; gap:7px; background:var(--blanco); border:.5px solid var(--linea); border-radius:10px; padding:8px 13px; font-size:13px; font-weight:500; color:var(--t72); cursor:pointer}
  .pill .cx{color:var(--t30)}
  .pill.proffilter{display:inline-flex}
  body.prof .pill.proffilter{display:none}

  /* day group + rows */
  .day{margin-bottom:26px}
  .daylabel{font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--t48); text-transform:uppercase; margin:0 0 10px 2px}
  .rows{background:var(--blanco); border:.5px solid var(--linea); border-radius:14px; overflow:hidden}
  .row{display:grid; grid-template-columns:78px 1.6fr 1.5fr 130px auto; align-items:center; gap:16px; padding:15px 18px; border-top:.5px solid var(--linea); cursor:pointer; transition:background .12s}
  .row:first-child{border-top:0}
  .row:hover{background:#fbfbfd}
  .row.prof-col-off{grid-template-columns:78px 1.7fr 1.6fr auto}
  .cell-time .t1{font-size:15px; font-weight:600}
  .cell-time .t2{font-size:11.5px; color:var(--t48); margin-top:2px}
  .cell-cli .c1{font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px}
  .cell-cli .c2{font-size:12px; color:var(--t48); margin-top:2px}
  .cell-cli a{color:var(--t48); text-decoration:none}
  .cell-cli a:hover{color:var(--tinta); text-decoration:underline}
  .cell-srv .s1{font-size:13.5px; font-weight:500}
  .cell-srv .s2{font-size:12px; color:var(--t48); margin-top:2px}
  .cell-prof{font-size:13px; color:var(--t72)}
  .cell-prof.hide{display:none}
  .cell-act{display:flex; align-items:center; justify-content:flex-end; gap:8px; min-width:0}

  .badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; white-space:nowrap}
  .badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
  .b-pendiente{color:#7a5b12; background:#f3ead0}
  .b-confirmado{color:#245c3b; background:#e0ecdf}
  .b-rechazado{color:#8f322c; background:#f4e3e1}
  .b-cancelado{color:#57545e; background:#ececef}
  .b-completado{color:#3a3a3d; background:#eceaf0}
  .b-ausente{color:#7a4a2a; background:#f0e4da}

  .urg{font-size:11.5px; font-weight:600; color:#7a5b12; background:#f3ead0; border-radius:999px; padding:4px 10px; white-space:nowrap}
  .urg.hot{color:#8f322c; background:#f4e3e1}
  .flag{font-size:10.5px; font-weight:600; color:var(--t48); border:.5px solid var(--linea2); border-radius:6px; padding:2px 6px; letter-spacing:.02em}

  .btn{font-family:var(--sans); font-size:12.5px; font-weight:600; border-radius:9px; padding:8px 14px; cursor:pointer; border:.5px solid var(--linea2); background:var(--blanco); color:var(--tinta); white-space:nowrap}
  .btn:hover{background:var(--papel)}
  .btn.solid{background:var(--tinta); color:var(--papel); border-color:var(--tinta)}
  .btn.solid:hover{background:#2a2a2a}
  .btn.sm{padding:7px 12px; font-size:12px}
  .kebab{width:32px; height:32px; border-radius:8px; border:.5px solid var(--linea2); background:var(--blanco); color:var(--t72); display:grid; place-items:center; cursor:pointer; flex:none}
  .kebab:hover{background:var(--papel); color:var(--tinta)}
  .muted-note{font-size:12px; color:var(--t30)}

  .empty{background:var(--blanco); border:.5px dashed var(--linea2); border-radius:14px; padding:40px; text-align:center; color:var(--t48); font-size:13.5px}

  /* drawer */
  .scrim{position:fixed; inset:0; background:rgba(21,21,21,.28); opacity:0; pointer-events:none; transition:opacity .18s; z-index:20}
  .scrim.open{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100vh; width:436px; max-width:92vw; background:var(--blanco); border-left:.5px solid var(--linea); transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1); z-index:21; display:flex; flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .dhead{display:flex; align-items:center; gap:12px; padding:20px 22px; border-bottom:.5px solid var(--linea)}
  .dhead .code{font-size:13px; font-weight:600; letter-spacing:.03em}
  .dclose{margin-left:auto; width:32px; height:32px; border-radius:8px; border:0; background:var(--papel); color:var(--t72); cursor:pointer; display:grid; place-items:center}
  .dclose:hover{color:var(--tinta)}
  .dbody{padding:22px; overflow:auto; flex:1}
  .dcli{font-family:var(--serif); font-weight:600; font-size:22px; margin:0 0 4px}
  .dmeta{display:flex; flex-direction:column; gap:2px; margin-bottom:20px}
  .dmeta a{font-size:13px; color:var(--t72); text-decoration:none}
  .dmeta a:hover{text-decoration:underline}
  .drow{display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-top:.5px solid var(--linea); font-size:13.5px}
  .drow .k{color:var(--t48)}
  .drow .v{font-weight:500; text-align:right}
  .dsec{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--t48); margin:24px 0 12px}
  .tl{list-style:none; margin:0; padding:0}
  .tl li{position:relative; padding:0 0 16px 22px}
  .tl li::before{content:''; position:absolute; left:4px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--tinta)}
  .tl li::after{content:''; position:absolute; left:7.5px; top:12px; bottom:-4px; width:1px; background:var(--linea)}
  .tl li:last-child{padding-bottom:0}
  .tl li:last-child::after{display:none}
  .tl .te{font-size:13px; font-weight:600}
  .tl .td{font-size:12px; color:var(--t48); margin-top:1px}
  .dact{padding:16px 22px; border-top:.5px solid var(--linea); display:flex; gap:10px; flex-wrap:wrap}
  .dact .btn{flex:1}
  .motivo{width:100%}
  .motivo textarea{width:100%; font-family:var(--sans); font-size:13px; border:.5px solid var(--linea2); border-radius:9px; padding:9px 11px; resize:vertical; min-height:52px; outline:none}
  .motivo textarea:focus{border-color:var(--tinta); box-shadow:0 0 0 3px rgba(21,21,21,.08)}
  .confirmbar{width:100%; background:#f4e3e1; border:.5px solid #e8ccc8; border-radius:9px; padding:10px 12px; font-size:12.5px; color:#8f322c; display:flex; align-items:center; gap:10px}
  .confirmbar span{flex:1}

  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .side{flex-direction:row; align-items:center; border-right:0; border-bottom:.5px solid var(--linea); padding:12px 16px}
    .brand{padding:0}
    .nav{flex-direction:row; margin-left:16px; overflow:auto}
    .nav a span.lbl{display:none}
    .side .spacer{display:none}
    .who{border-top:0; margin:0 0 0 auto; padding:0}
    .who .wn,.who .wr{display:none}
    .main{padding:18px 16px 60px}
    .row,.row.prof-col-off{grid-template-columns:64px 1fr auto; gap:12px}
    .cell-srv,.cell-prof{display:none}
    .drawer{width:100vw}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function setRole(r){
  role=r;
  document.body.className=r==='admin'?'admin':'prof';
  document.getElementById('whoAv').textContent=r==='admin'?'CG':'RB';
  document.getElementById('whoName').textContent=r==='admin'?'Camila González':'Rocío Benítez';

function visible(t){ if(role==='prof' && t.prof!=='rb') return false; if(filter!=='todos' && t.estado!==filter) return false; return true; }

  var sc=scoped();
  var counts={todos:sc.length}; ESTADOS.forEach(function(e){counts[e]=sc.filter(function(t){return t.estado===e}).length});
  var pend=counts.pendiente||0;
  document.getElementById('headSub').textContent=pend+(pend===1?' turno pendiente':' turnos pendientes')+' por revisar';

  var segs=[['todos','Todos']].concat([['pendiente','Pendientes'],['confirmado','Confirmados']]).concat([['rechazado','Rechazados'],['cancelado','Cancelados'],['completado','Completados'],['ausente','Ausentes']]);

    var c=counts[s[0]]||0;
    return '<button class="'+(filter===s[0]?'on':'')+'" onclick="setFilter(\''+s[0]+'\')">'+s[1]+(c?'<span class="cnt">'+c+'</span>':'')+'</button>';

      '<div class="dmeta"><a href="tel:'+t.tel+'">'+t.telD+'</a>'+(t.email?'<a href="mailto:'+t.email+'">'+t.email+'</a>':'<span class="muted-note">sin email</span>')+'</div>'+
      (t.fuera?'<div class="confirmbar" style="margin-bottom:16px"><span>Cargado fuera de la grilla habitual.</span></div>':'')+
      '<div class="drow"><span class="k">Servicio</span><span class="v">'+t.srv+'</span></div>'+
      '<div class="drow"><span class="k">Duración</span><span class="v num">'+t.dur+' min</span></div>'+
      '<div class="drow"><span class="k">Precio</span><span class="v num">'+money(t.precio)+'</span></div>'+
      '<div class="drow"><span class="k">Profesional</span><span class="v">'+PROFS[t.prof]+'</span></div>'+
      '<div class="drow"><span class="k">Fecha</span><span class="v">'+fecha+'</span></div>'+
      (t.ini!=='—'?'<div class="drow"><span class="k">Horario</span><span class="v num">'+t.ini+'–'+t.fin+'</span></div>':'')+
      '<div class="drow"><span class="k">Origen</span><span class="v">'+(t.origen==='web'?'Reserva web':'Cargado en el salón')+'</span></div>'+
      '<div class="dsec">Historial</div>'+
      '<ul class="tl">'+t.hist.map(function(h){return '<li><div class="te">'+h.e+'</div><div class="td">'+h.q+' · '+h.c+'</div></li>'}).join('')+'</ul>'+
    '</div>'+
    '<div class="dact" id="dact">'+acts+'</div>';
}

function askMotivo(id,action){
  var label=action==='rechazar'?'Rechazar turno':'Cancelar turno';
  document.getElementById('dact').innerHTML=
    '<div class="motivo"><textarea placeholder="Motivo (opcional) — queda en el historial"></textarea></div>'+
    '<button class="btn solid" style="background:#8f322c;border-color:#8f322c" onclick="act(event,'+id+',\''+action+'\')">'+label+'</button>'+
    '<button class="btn" onclick="fillDrawer(T.find(function(x){return x.id==='+id+'}))">Volver</button>';
}

setRole('admin');
</script>
</body>
</html>
