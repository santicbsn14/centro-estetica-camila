<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Camila González</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#151515; --papel:#f8f7fb; --blanco:#ffffff;
    --tinta-72:#4a4a4c; --tinta-48:#7c7c7e;
    --linea:#e6e5eb; --linea-fuerte:#d4d3db;
    --err:#8f322c; --err-bg:#f5e6e4; --err-linea:#e8ccc8;
    --serif:'Fraunces','Playfair Display',Georgia,serif;
    --sans:'Montserrat',system-ui,-apple-system,sans-serif;
    --radio:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--papel); color:var(--tinta); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:grid; place-items:center; padding:32px 20px;
  }
  .wrap{width:100%; max-width:376px}

  .lockup{text-align:center; margin-bottom:26px}
  .lockup img{width:72px; height:auto; display:inline-block; margin-bottom:14px}
  .marca{
    font-family:var(--serif); font-weight:600; font-size:25px;
    letter-spacing:.075em; text-transform:uppercase; line-height:1; margin:0;
  }
  .tagline{
    font-size:10.5px; font-weight:500; letter-spacing:.34em;
    text-transform:uppercase; color:var(--tinta-48); margin:9px 0 0;
  }

  .card{
    background:var(--blanco); border:.5px solid var(--linea);
    border-radius:var(--radio); padding:30px 28px 26px;
  }
  .eyebrow{
    font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:var(--tinta-48); text-align:center; margin:0 0 22px;
  }

  .banner{
    display:none; align-items:center; gap:9px;
    background:var(--err-bg); border:.5px solid var(--err-linea);
    color:var(--err); font-size:13px; line-height:1.4;
    border-radius:9px; padding:10px 12px; margin-bottom:18px;
  }
  .banner.show{display:flex}
  .banner svg{flex:none}

  .field{margin-bottom:16px}
  .field label{
    display:block; font-size:13px; font-weight:500; color:var(--tinta-72);
    margin-bottom:7px; letter-spacing:.01em;
  }
  .input-row{position:relative}
  input{
    width:100%; height:44px; padding:0 14px; font-family:var(--sans);
    font-size:15px; color:var(--tinta); background:var(--blanco);
    border:.5px solid var(--linea-fuerte); border-radius:10px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input::placeholder{color:var(--tinta-48)}
  input:hover{border-color:#c3c2cb}
  input:focus{border-color:var(--tinta); box-shadow:0 0 0 3px rgba(21,21,21,.10)}
  input[aria-invalid="true"]{border-color:var(--err); box-shadow:0 0 0 3px rgba(143,50,44,.10)}
  input#pass{padding-right:44px}
  .toggle{
    position:absolute; right:6px; top:6px; width:32px; height:32px;
    display:grid; place-items:center; border:0; background:transparent;
    color:var(--tinta-48); cursor:pointer; border-radius:8px;
  }
  .toggle:hover{color:var(--tinta); background:var(--papel)}
  .hint{display:none; font-size:12px; color:var(--err); margin-top:6px}
  .hint.show{display:block}

  button.submit{
    width:100%; height:46px; margin-top:6px; border:0; border-radius:10px;
    background:var(--tinta); color:var(--papel); font-family:var(--sans);
    font-size:14px; font-weight:600; letter-spacing:.02em; cursor:pointer;
    transition:background .15s, transform .05s;
  }
  button.submit:hover{background:#2a2a2a}
  button.submit:active{transform:scale(.99)}
  button.submit:focus-visible{outline:2px solid var(--tinta); outline-offset:2px}

  .foot{
    text-align:center; font-size:12px; color:var(--tinta-48);
    margin-top:18px; line-height:1.5;
  }
  .foot a{color:var(--tinta-72); text-decoration:underline; text-underline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <h1 class="marca">Camila González</h1>
      <p class="tagline">Salón de belleza</p>
    </div>

    <section class="card" aria-label="Ingresar al panel">
      <p class="eyebrow">Panel de gestión</p>

      <div class="banner" id="banner" role="alert" aria-live="assertive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Email o contraseña incorrectos.</span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-row">
          <input id="email" type="email" autocomplete="username" placeholder="camila@camigonzalez.com">
        </div>
        <p class="hint" id="hint-email">Ingresá tu email.</p>
      </div>

      <div class="field">
        <label for="pass">Contraseña</label>
        <div class="input-row">
          <input id="pass" type="password" autocomplete="current-password" placeholder="Tu contraseña">
          <button class="toggle" id="toggle" type="button" aria-label="Mostrar contraseña">
            <svg id="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="hint" id="hint-pass">Ingresá tu contraseña.</p>
      </div>

      <button class="submit" id="submit" type="button">Ingresar</button>
    </section>

    <p class="foot">¿Olvidaste tu contraseña? <a href="#" id="reset">Pedísela a Camila.</a></p>
  </main>

<script>
  var email=document.getElementById('email'),
      pass=document.getElementById('pass'),
      banner=document.getElementById('banner'),
      hE=document.getElementById('hint-email'),
      hP=document.getElementById('hint-pass');

  function clearField(el,hint){el.setAttribute('aria-invalid','false');hint.classList.remove('show');}
  email.addEventListener('input',function(){clearField(email,hE);banner.classList.remove('show');});
  pass.addEventListener('input',function(){clearField(pass,hP);banner.classList.remove('show');});

  document.getElementById('toggle').addEventListener('click',function(){
    var showing=pass.type==='text';
    pass.type=showing?'password':'text';
    this.setAttribute('aria-label',showing?'Mostrar contraseña':'Ocultar contraseña');
  });

  document.getElementById('submit').addEventListener('click',function(){
    var ok=true; banner.classList.remove('show');
    if(!email.value.trim()){email.setAttribute('aria-invalid','true');hE.classList.add('show');ok=false;}
    if(!pass.value){pass.setAttribute('aria-invalid','true');hP.classList.add('show');ok=false;}
    if(!ok){ (email.value.trim()?pass:email).focus(); return; }
    banner.classList.add('show');            /* simula 401 CREDENCIALES_INVALIDAS */
    email.setAttribute('aria-invalid','true');
    pass.setAttribute('aria-invalid','true');
  });

  document.getElementById('reset').addEventListener('click',function(e){e.preventDefault();});
</script>
</body>
</html>
